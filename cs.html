<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    html, body { margin: 0; padding: 0; background: #88ccff; }
    #c { width: 100vw; height: 100vh; display: block; }
    #msg {
        position: fixed; top: 10px; left: 10px;
        background: white; padding: 8px 12px; border-radius: 6px;
        font-family: monospace; font-size: 14px; z-index: 999;
    }
</style>
</head>
<body>
<div id="msg">正在初始化…</div>
<canvas id="c"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const msg = document.getElementById('msg');
const canvas = document.getElementById('c');

/* 1. 检查 WebGL 支持 */
const testGL = document.createElement('canvas');
const gl = testGL.getContext('webgl2') || testGL.getContext('webgl');

if (!gl) {
    msg.textContent = '❌ 不支持 WebGL';
    msg.style.background = 'red';
    msg.style.color = 'white';
} else {
    const version = testGL.getContext('webgl2') ? 'WebGL2' : 'WebGL1';
    msg.textContent = `✓ ${version} 支持中…`;
}

try {
    /* 2. 创建渲染器 */
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setPixelRatio(1);   // 用 1 测试
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);

    /* 3. 场景 */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x88ccff);

    const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.z = 3;

    const cube = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshBasicMaterial({ color: 0xff0000 })
    );
    scene.add(cube);

    /* 4. 渲染循环 */
    let frames = 0;
    function animate() {
        requestAnimationFrame(animate);
        cube.rotation.y += 0.01;
        cube.rotation.x += 0.005;
        renderer.render(scene, camera);
        frames++;
        if (frames === 60) {
            msg.textContent = `✓ 运行中 (${gl.getParameter ? gl.getParameter(gl.VERSION) : '?'})`;
            msg.style.background = 'lightgreen';
            setTimeout(() => msg.style.display = 'none', 3000);
        }
    }
    animate();

} catch (err) {
    msg.textContent = '❌ 创建失败: ' + err.message;
    msg.style.background = 'red';
    msg.style.color = 'white';
    console.error(err);
}
</script>
</body>
</html>

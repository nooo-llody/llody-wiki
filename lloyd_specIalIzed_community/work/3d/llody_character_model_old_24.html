    <model-viewer

    environment-image="neutral"

    <!-- ===== 动画切换按钮 ===== -->

</div>

<!-- ===== 控制脚本（放在这里，紧跟在模型和按钮之后） ===== -->
<script>
    (function() {
        const viewer = document.getElementById('model-viewer');
        const controls = document.getElementById('animControls');

        // ===== 动画名称映射表（数字 → 显示名称） =====
        const nameMap = {
            '1': '待机',   // 根据实际数字调整
            '2': '飞行',
            '3': '掉落物',
            '4': '幻影旋转',
            '5': '战斗姿态'
            // 继续添加...
        };

        function getDisplayName(animName) {
            return nameMap[animName] || `▶ ${animName}`;
        }

        if (!viewer || !controls) return;

        viewer.addEventListener('load', function() {
            const anims = this.availableAnimations || [];
            console.log('可用动画:', anims);

            controls.innerHTML = '';
            
            if (anims.length === 0) {
                controls.innerHTML = '<span style="opacity:0.6;">无可用动画</span>';
                return;
            }

            anims.forEach(animName => {
                const btn = document.createElement('button');
                btn.textContent = getDisplayName(animName);
                btn.className = 'card-btn';
                btn.style.margin = '0';
                btn.dataset.anim = animName;
                btn.addEventListener('click', function() {
                    viewer.animationName = animName;
                    viewer.play();
                    console.log(`✅ 切换动画: ${animName}`);
                });
                controls.appendChild(btn);
            });

            if (this.animationName && this.paused) {
                this.play();
            }
        });

        viewer.addEventListener('error', (e) => {
            console.error('❌ 模型加载失败:', e.detail);
            controls.innerHTML = '<span style="color:#e74c3c;">加载失败，请检查路径</span>';
        });
    })();
</script>
